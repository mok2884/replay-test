name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy sounddevice pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --onedir --name Replay
          --collect-all _sounddevice_data replay.py

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Replay\Replay.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "dist\Replay\selftest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item "dist\Replay\selftest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Replay-windows
          path: dist/Replay
          if-no-files-found: error
