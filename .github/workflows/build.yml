name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy sounddevice tkinterdnd2 pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --onedir --name ChallengeANN
          --icon icon.ico --add-data "icon.ico;."
          --collect-all _sounddevice_data --collect-all tkinterdnd2 replay.py

      - name: Remove unused ASIO libraries
        shell: pwsh
        run: |
          Get-ChildItem "dist\ChallengeANN" -Recurse -Filter "*asio*" | ForEach-Object { Write-Output $_.FullName; Remove-Item $_.FullName }
          if (Get-ChildItem "dist\ChallengeANN" -Recurse -Filter "*asio*") { exit 1 }

      - name: Name the exe チャレンジANN_テスト版
        shell: pwsh
        run: |
          Rename-Item "dist\ChallengeANN\ChallengeANN.exe" "チャレンジANN_テスト版.exe"
          New-Item -ItemType Directory -Path "out" | Out-Null
          Move-Item "dist\ChallengeANN" "out\チャレンジANN_テスト版"
          Get-ChildItem "out\チャレンジANN_テスト版" | Select-Object -First 5

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out\チャレンジANN_テスト版\チャレンジANN_テスト版.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "out\チャレンジANN_テスト版\selftest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item "out\チャレンジANN_テスト版\selftest.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: ChallengeANN-TEST-windows
          path: out
          if-no-files-found: error
